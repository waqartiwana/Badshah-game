<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badshah Wazir Sapahi Chor</title>
<style>
:root{--felt:#14382b;--felt2:#0e2a20;--slip:#f6f1e4;--ink:#1d1b16;--red:#b3261e;--gold:#e8b94a;--mute:#9fb8ac}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--felt);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px 14px 40px;max-width:520px;margin-inline:auto}
h1{font-family:Georgia,serif;font-size:26px;margin:6px 0 4px}
h2{font-family:Georgia,serif;font-size:20px;margin:0 0 8px}
p{margin:6px 0;line-height:1.45;color:var(--mute)}
input,select{width:100%;padding:13px;border-radius:10px;border:2px solid #2d5a49;background:var(--felt2);color:#fff;font-size:17px;margin:6px 0}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--gold);color:var(--ink);font-size:17px;font-weight:700;margin:8px 0;cursor:pointer}
button.alt{background:transparent;color:#fff;border:2px solid #2d5a49}
button:disabled{opacity:.4}
.box{background:var(--felt2);border-radius:14px;padding:14px;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.slip{background:var(--slip);color:var(--ink);border-radius:6px;padding:18px;text-align:center;border:2px dashed #b9ae8f;transform:rotate(-1.5deg);margin:14px 6px}
.slip .big{font-size:54px}
.slip .nm{font-family:Georgia,serif;font-size:30px;font-weight:700}
.slip .pt{font-family:Georgia,serif;font-size:36px;color:var(--red);font-weight:700}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #24493b}
.row:last-child{border:0}
.call{font-family:Georgia,serif;font-size:28px;text-align:center;color:var(--gold);padding:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.me{color:var(--gold)}
.ok{color:#7ee2a8}.bad{color:#ff8b80}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc,updateDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPJhqTGW4KajDkFUmvYXpklVKkV4gEOrg",
  authDomain: "badshah-ka-wazir-kon.firebaseapp.com",
  projectId: "badshah-ka-wazir-kon",
  storageBucket: "badshah-ka-wazir-kon.firebasestorage.app",
  messagingSenderId: "144426600510",
  appId: "1:144426600510:web:6a9efcbcaeb1a1b7b1a96f"
};

const db = getFirestore(initializeApp(firebaseConfig));
const R = {
  badshah:{n:"Badshah",p:1000,e:"👑"},
  wazir:{n:"Wazir",p:600,e:"🧠"},
  sapahi:{n:"Sapahi",p:200,e:"💂"},
  chor:{n:"Chor",p:0,e:"🥷"}
};
const $ = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let myId = localStorage.getItem("bw_id");
if(!myId){ myId = Math.random().toString(36).slice(2,10); localStorage.setItem("bw_id", myId); }
let myName = localStorage.getItem("bw_name") || "";
let code = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
let unsub = null, data = null;
const ref = c => doc(db, "rooms", c);

function home(){
  $.innerHTML = `<h1>👑 Badshah Wazir Sapahi Chor</h1>
  <p>4 dost, 4 parchian. Apna naam likho aur khelo.</p>
  <div class="box">
    <input id="nm" placeholder="Aapka naam" value="${esc(myName)}" maxlength="14">
    ${code ? `<p>Room: <b>${esc(code)}</b></p><button onclick="joinRoom()">Room mein shamil ho jao</button>`
    : `<select id="rounds"><option value="10">10 games</option><option value="12">12 games</option><option value="15">15 games</option></select>
       <button onclick="createRoom()">Naya room banao</button>`}
  </div>`;
}
function readName(){
  const v = document.getElementById("nm").value.trim();
  if(!v){ alert("Pehle apna naam likho"); return null; }
  myName = v; localStorage.setItem("bw_name", v); return v;
}
window.createRoom = async () => {
  const name = readName(); if(!name) return;
  const total = +document.getElementById("rounds").value;
  code = Array.from({length:4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
  try{
    await setDoc(ref(code), {players:[{id:myId,name,total:0}], phase:"lobby", round:0, totalRounds:total, hostId:myId, roles:{}, guessId:null, roundPoints:null, correct:null});
  }catch(e){ alert("Room nahi ban saka. Firebase config aur Firestore check karo.\n"+e.message); return; }
  history.replaceState(null,"","?room="+code); listen();
};
window.joinRoom = async () => {
  const name = readName(); if(!name) return;
  try{
    await runTransaction(db, async tx => {
      const s = await tx.get(ref(code));
      if(!s.exists()) throw new Error("Ye room nahi mila");
      const d = s.data();
      if(d.players.some(p => p.id===myId)) return;
      if(d.phase!=="lobby") throw new Error("Game shuru ho chuki hai");
      if(d.players.length>=4) throw new Error("Room full hai (4 players)");
      tx.update(ref(code), {players:[...d.players, {id:myId,name,total:0}]});
    });
  }catch(e){ alert(e.message); return; }
  listen();
};
function listen(){
  if(unsub) unsub();
  unsub = onSnapshot(ref(code), s => { if(s.exists()){ data = s.data(); render(); } });
}
const upd = o => updateDoc(ref(code), o);
const nameOf = id => (data.players.find(p => p.id===id)||{name:"?"}).name;
const idOf = role => Object.keys(data.roles).find(k => data.roles[k]===role);

window.startRound = () => {
  const roles = ["badshah","wazir","sapahi","chor"].sort(() => Math.random()-.5);
  const map = {}; data.players.forEach((p,i) => map[p.id] = roles[i]);
  upd({roles:map, phase:"ask", round:data.round+1, guessId:null, roundPoints:null, correct:null});
};
window.askWazir = () => upd({phase:"call"});
window.jiHuzoor = () => upd({phase:"guess"});
window.guess = gid => {
  const chorId = idOf("chor"), correct = gid===chorId;
  const pts = {};
  data.players.forEach(p => {
    let r = data.roles[p.id];
    if(!correct && r==="wazir") r = "chor";
    else if(!correct && r==="chor") r = "wazir";
    pts[p.id] = R[r].p;
  });
  const players = data.players.map(p => ({...p, total:p.total+pts[p.id]}));
  upd({players, guessId:gid, roundPoints:pts, correct, phase:"reveal"});
};
window.nextRound = () => data.round>=data.totalRounds ? upd({phase:"final"}) : startRound();
window.playAgain = () => upd({players:data.players.map(p => ({...p,total:0})), phase:"lobby", round:0, roles:{}});
window.shareWA = () => {
  const link = location.origin + location.pathname + "?room=" + code;
  window.open("https://wa.me/?text=" + encodeURIComponent("Badshah Wazir Sapahi Chor khelo! Room "+code+": "+link));
};

function board(){
  const sorted = [...data.players].sort((a,b) => b.total-a.total);
  return `<div class="box"><h2>Score</h2>${sorted.map(p =>
    `<div class="row"><span class="${p.id===myId?"me":""}">${esc(p.name)}</span><b>${p.total}</b></div>`).join("")}</div>`;
}
function myCard(){
  const r = R[data.roles[myId]];
  return `<div class="slip"><div class="big">${r.e}</div><div class="nm">${r.n}</div><div class="pt">${r.p}</div></div>`;
}
function render(){
  if(!data.players.some(p => p.id===myId)){ home(); return; }
  const isHost = data.hostId===myId, ph = data.phase, role = data.roles[myId];
  let h = `<div class="top"><span>Room <b>${code}</b></span><span>${ph==="lobby"||ph==="final"?"":`Game ${data.round}/${data.totalRounds}`}</span></div>`;

  if(ph==="lobby"){
    h += `<h1>Intezar...</h1><div class="box">${data.players.map(p => `<div class="row"><span>${esc(p.name)}</span><span>✔</span></div>`).join("")}<p>${data.players.length}/4 players</p></div>
    <button onclick="shareWA()">WhatsApp pe link bhejo</button>
    ${isHost ? `<button ${data.players.length<4?"disabled":""} onclick="startRound()">Game shuru karo</button>` : `<p>Host ke game shuru karne ka intezar.</p>`}`;
  }
  else if(ph==="ask"){
    h += myCard() + (role==="badshah"
      ? `<button onclick="askWazir()">Bolo: "Badshah ka wazir kon?"</button>`
      : `<p>Apni parchi kisi ko mat dikhana. Badshah ke bolne ka intezar...</p>`) + board();
  }
  else if(ph==="call"){
    h += myCard() + `<div class="call">"Badshah ka wazir kon?"</div>` + (role==="wazir"
      ? `<button onclick="jiHuzoor()">G huzoor! G huzoor!</button>` : `<p>Jiske pas Wazir hai wo jawab dega...</p>`) + board();
  }
  else if(ph==="guess"){
    const wid = idOf("wazir"), bid = idOf("badshah");
    h += myCard() + `<div class="call">${esc(nameOf(wid))} ne kaha: "G huzoor!"</div>
    <p style="text-align:center">${esc(nameOf(bid))} (Badshah) ka hukam: baqi do mein se chor kon?</p>`;
    if(role==="wazir"){
      const others = data.players.filter(p => p.id!==myId && p.id!==bid);
      h += `<div class="grid">${others.map(p => `<button onclick="guess('${p.id}')">${esc(p.name)}</button>`).join("")}</div>`;
    } else h += `<p style="text-align:center">Wazir soch raha hai...</p>`;
    h += board();
  }
  else if(ph==="reveal"){
    h += `<h1 class="${data.correct?"ok":"bad"}">${data.correct?"Wazir ne chor pakad liya! ✅":"Wazir ghalat nikla! ❌"}</h1>
    ${!data.correct?`<p>Wazir ke 0 number aur chor ko 600!</p>`:""}
    <div class="box">${data.players.map(p => { const r = R[data.roles[p.id]];
      return `<div class="row"><span>${r.e} ${esc(p.name)} (${r.n})</span><b>+${data.roundPoints[p.id]}</b></div>`; }).join("")}</div>`
      + board() + (isHost ? `<button onclick="nextRound()">${data.round>=data.totalRounds?"Final result dekho":"Agla game"}</button>` : `<p>Host agla game shuru karega.</p>`);
  }
  else if(ph==="final"){
    const s = [...data.players].sort((a,b) => b.total-a.total), medals = ["🥇 1st","🥈 2nd","🥉 3rd","😅 Haar gaya"];
    h += `<h1>Final Result</h1><div class="box">${s.map((p,i) => `<div class="row"><span>${medals[i]} — ${esc(p.name)}</span><b>${p.total}</b></div>`).join("")}</div>`
      + (isHost ? `<button onclick="playAgain()">Dobara khelo</button>` : "");
  }
  $.innerHTML = h;
}

if(code && myName){
  runTransaction(db, async tx => {
    const s = await tx.get(ref(code));
    if(s.exists() && s.data().players.some(p => p.id===myId)) return;
    throw new Error("x");
  }).then(listen).catch(home);
} else home();
</script>
</body>
</html>
